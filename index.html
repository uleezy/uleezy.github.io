<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ulaville Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: white;
      background: #090309;
    }

    .title-screen,
    .homepage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }

    .title-screen {
      background:
        radial-gradient(circle at center, #ff4fc355, transparent 35%),
        #090309;
    }

    .homepage {
      display: none;
      background:
        radial-gradient(circle at center, #ffd36a55, transparent 35%),
        #140712;
    }

    .logo {
      font-size: clamp(5rem, 20vw, 12rem);
      font-weight: 900;
      letter-spacing: -0.15em;
      color: transparent;
      background: linear-gradient(90deg, #ffd36a, #ff4fc3, #80d8ff, #ffd36a);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shine 3s linear infinite;
    }

    .start-link {
      display: inline-block;
      margin-top: 2rem;
      padding: 1rem 2rem;
      border-radius: 999px;
      color: #140712;
      background: linear-gradient(90deg, #ffd36a, #ff4fc3);
      font-weight: 900;
      text-decoration: none;
    }

    #home:target {
      display: grid;
    }

    body:has(#home:target) .title-screen {
      display: none;
    }

    @keyframes shine {
      from {
        background-position: 0% 50%;
      }

      to {
        background-position: 300% 50%;
      }
    }
  </style>
</head>

<body>
  <main class="title-screen">
    <div>
      <div class="logo">ULA</div>
      <h1>PRESS START TEST</h1>
      <p>If this works, the real site will work with the same method.</p>

      <a class="start-link" href="#home">
        PRESS START
      </a>
    </div>
  </main>

  <main id="home" class="homepage">
    <div>
      <div class="logo">ULA</div>
      <h1>HOMEPAGE UNLOCKED</h1>
      <p>This is the real page layer. If you see this, we solved the Start problem.</p>

      <a class="start-link" href="#">
        RETURN TO TITLE
      </a>
    </div>
  </main>
</body>
</html>
